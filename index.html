    const fmtRelative = (ms) => {
      const diff = Date.now() - ms;
      if (diff < 60000) return `${Math.max(1, Math.floor(diff / 1000))} sec ago`;
      if (diff < 3600000) return `${Math.floor(diff / 60000)} min ago`;
      if (diff < 86400000) return `${Math.floor(diff / 3600000)} hr ago`;
      return `${Math.floor(diff / 86400000)} days ago`;
    };

    const fmtClock = (ms) => {
      const d = new Date(ms);
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    };
    const fmtClockSec = (ms) => {
      const d = new Date(ms);
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
    };

    let _hSeq = 0;
    const histId = () => `h-${++_hSeq}`;

    // Build a synthetic verification history for a pre-seeded patient.
    const synthesizeHistory = (patient) => {
      const entries = [];
      const baseMs = patient.verifiedAt;
      const tsBase = fmtClockSec(baseMs);
      const tsBefore = fmtClockSec(baseMs - 4000);
      if (patient.status === 'verified') {
        entries.push({ id: histId(), ts: tsBefore, worker: 'Eligibility Verification', action: 'Querying CMS HETS for Medicare Part A and Part B status.', result: 'verified', durationMs: 1100 + randInt(-200, 400) });
        entries.push({ id: histId(), ts: tsBase, worker: 'Eligibility Verification', action: 'Eligibility confirmed. Updated patient record.', result: 'verified', durationMs: 800 + randInt(-100, 300) });
        if (Math.random() < 0.55) {
          entries.push({ id: histId(), ts: fmtClockSec(baseMs + 2000), worker: 'Insurance Change Detection', action: 'Cross-referenced payer information. No changes detected.', result: 'no change', durationMs: 700 + randInt(-100, 200) });
        }
      } else if (patient.status === 'pending') {
        entries.push({ id: histId(), ts: tsBase, worker: 'Eligibility Verification', action: 'Querying CMS HETS for Medicare Part A and Part B status.', result: 'pending', durationMs: 1100 });
      } else if (patient.status === 'exception') {
        entries.push({ id: histId(), ts: tsBefore, worker: 'Eligibility Verification', action: 'Querying CMS HETS for Medicare Part A and Part B status.', result: 'verified', durationMs: 1200 });
        entries.push({ id: histId(), ts: fmtClockSec(baseMs - 2000), worker: 'Eligibility Verification', action: 'Eligibility confirmed.', result: 'verified', durationMs: 900 });
        const sr = SHORT_REASON[patient.exceptionReason] || patient.exceptionReason.toLowerCase();
        entries.push({ id: histId(), ts: tsBase, worker: 'Insurance Change Detection', action: `Detected ${sr}. Flagging for review.`, result: 'flagged', durationMs: 1000 });
      }
      return entries;
    };

    const generateInitialPatients = () => {
      const patients = [];
      const now = Date.now();
      // PIDs from 1660 (oldest) to 1847 (most recent). Spread last verified across last 24h.
      const total = 1847 - 1660 + 1;
      for (let i = 1847; i >= 1660; i--) {
        const id = `PT-${String(i).padStart(6, '0')}`;
        const idx = 1847 - i;
        const ageMs = idx * (24 * 3600 * 1000 / total);
        const verifiedAt = now - ageMs - randInt(0, 60000);

        const isException = !!PRE_SEEDED_EXCEPTIONS_MAP[id];
        let status, exceptionReason, urgency, flaggedAt;
        if (isException) {
          const exc = PRE_SEEDED_EXCEPTIONS_MAP[id];
          status = 'exception';
          exceptionReason = exc.reason;
          urgency = exc.urgency;
          flaggedAt = exc.flaggedAt;
        } else {
          status = Math.random() < 0.025 ? 'pending' : 'verified';
        }

        const r = Math.random();
        const coverage = r < 0.35 ? 'Medicare' : (r < 0.85 ? 'MA Plan' : 'Dual Eligible');
        const plan = pickRandom(PLANS_BY_COVERAGE[coverage]);
        const verifiedBy = Math.random() < 0.5 ? 'Eligibility Verification' : 'Insurance Change Detection';

        const p = {
          id, status, coverage, plan, verifiedAt, verifiedBy,
          exceptionReason, urgency, flaggedAt,
          coverageHistory: isException
            ? [{ date: 'Today', label: PRE_SEEDED_EXCEPTIONS_MAP[id].reason, urgency, payer: plan.split(' ')[0] }]
            : [],
          notes: [],
          history: [],
          newlyAdded: false,
        };
        p.history = synthesizeHistory(p);
        patients.push(p);
      }
      return patients;
    };

    /* =====================================================
     *  SIMULATION ENGINE
     * ===================================================== */
    const initialTaskFor = (id) => {
      switch (id) {
        case 'w-elig': return 'Pulling next patient batch.';
        case 'w-change': return 'Watching for payer changes.';
        case 'w-triage': return 'Awaiting flagged exceptions.';
        default: return 'Initializing.';
      }
    };

    function useSimulation() {
      const [workers, setWorkers] = useState(INITIAL_WORKERS);
      const [feed, setFeed] = useState(INITIAL_FEED);
      const [exceptions, setExceptions] = useState(INITIAL_EXCEPTIONS);
      const [stats, setStats] = useState({
        processedToday: 312,
        processedMonth: 1847,
        hoursSavedMonth: 64.5,
        accuracy: 99.4,
        lastActivityHM: '09:42',
        liveLastMinute: 0,
      });
      const [throughput, setThroughput] = useState(buildSeedThroughput);
      const [integrations, setIntegrations] = useState(INITIAL_INTEGRATIONS);
      const [patients, setPatients] = useState(generateInitialPatients);

      const nextPidRef = useRef(1848);
      const triageQueueRef = useRef([]);   // exception ids waiting for triage routing
      const workersRef = useRef(workers);
      workersRef.current = workers;
      const feedSeqRef = useRef(0);
      const lastMinuteBucketRef = useRef([]); // [{ts, count}] last 60s

      const anyRunning = useMemo(() => workers.some(w => w.status === 'running'), [workers]);

      const pushFeed = useCallback((entry) => {
        feedSeqRef.current += 1;
        const _id = `f-${feedSeqRef.current}`;
        setFeed(f => [{ ...entry, _id }, ...f].slice(0, 100));
      }, []);

      const incCurrentHourThroughput = useCallback(() => {
        const h = new Date().getHours();
        const label = `${pad2(h)}:00`;
        setThroughput(t => t.map(b => b.hour === label ? { ...b, autonomous: b.autonomous + 1 } : b));
      }, []);

      const recordLiveTick = useCallback(() => {
        const now = Date.now();
        lastMinuteBucketRef.current.push(now);
        // prune
        lastMinuteBucketRef.current = lastMinuteBucketRef.current.filter(t => now - t < 60000);
      }, []);

      // Single-tick processor: process one patient through eligibility (a multi-portal chain)
      // followed by change detection, then optionally triage routing for flagged cases.
      const tickOnce = useCallback(() => {
        const fresh = workersRef.current;
        const eligOn = fresh.find(w => w.id === 'w-elig')?.status === 'running';
        const changeOn = fresh.find(w => w.id === 'w-change')?.status === 'running';
        const triageOn = fresh.find(w => w.id === 'w-triage')?.status === 'running';

        const stillRunning = (id) => workersRef.current.find(x => x.id === id)?.status === 'running';

        const pidNum = nextPidRef.current;
        nextPidRef.current = pidNum + 1;
        const pid = `PT-${String(pidNum).padStart(6, '0')}`;
        const ts0 = nowHMS();

        let processedAny = false;

        if (eligOn) {
          // STEP 1, T+0: Query CMS HETS.
          const dur1 = randInt(2200, 3400);
          pushFeed({ ts: ts0, worker: 'Eligibility Verification', patientId: pid, action: 'Querying CMS HETS for Medicare Part A and Part B status.', result: 'verified', durationMs: dur1 });

          // Add a brand-new patient record at the top of the table.
          const r = Math.random();
          const coverage = r < 0.35 ? 'Medicare' : (r < 0.85 ? 'MA Plan' : 'Dual Eligible');
          const plan = pickRandom(PLANS_BY_COVERAGE[coverage]);
          const verifiedAt = Date.now();
          const newPatient = {
            id: pid,
            status: 'verified',
            coverage,
            plan,
            verifiedAt,
            verifiedBy: 'Eligibility Verification',
            exceptionReason: null,
            urgency: null,
            flaggedAt: null,
            coverageHistory: [],
            notes: [],
            history: [
              { id: histId(), ts: ts0, worker: 'Eligibility Verification', action: 'Querying CMS HETS for Medicare Part A and Part B status.', result: 'verified', durationMs: dur1 },
            ],
            newlyAdded: true,
          };
          setPatients(ps => [newPatient, ...ps]);
          setTimeout(() => {
            setPatients(ps => ps.map(p => p.id === pid ? { ...p, newlyAdded: false } : p));
          }, 1500);

          setWorkers(ws => ws.map(w => w.id === 'w-elig' ? { ...w, currentTask: `Querying CMS HETS for ${pid}` } : w));

          // STEP 2, T+~3.5s: Pull beneficiary record from clearinghouse.
          setTimeout(() => {
            if (!stillRunning('w-elig')) return;
            const dur2 = randInt(1800, 2800);
            const ts1 = nowHMS();
            pushFeed({ ts: ts1, worker: 'Eligibility Verification', patientId: pid, action: 'Pulling beneficiary record from clearinghouse.', result: 'verified', durationMs: dur2 });
            setPatients(ps => ps.map(p => p.id === pid ? {
              ...p,
              history: [...p.history, { id: histId(), ts: ts1, worker: 'Eligibility Verification', action: 'Pulling beneficiary record from clearinghouse.', result: 'verified', durationMs: dur2 }],
            } : p));
            setWorkers(ws => ws.map(w => w.id === 'w-elig' ? { ...w, currentTask: `Pulling clearinghouse record for ${pid}` } : w));
          }, randInt(3200, 4000));

          // STEP 3, T+~6.5s: Cross-reference EMR record.
          setTimeout(() => {
            if (!stillRunning('w-elig')) return;
            const dur3 = randInt(1400, 2200);
            const ts2 = nowHMS();
            pushFeed({ ts: ts2, worker: 'Eligibility Verification', patientId: pid, action: 'Cross-referencing payer details against EMR record.', result: 'verified', durationMs: dur3 });
            setPatients(ps => ps.map(p => p.id === pid ? {
              ...p,
              history: [...p.history, { id: histId(), ts: ts2, worker: 'Eligibility Verification', action: 'Cross-referencing payer details against EMR record.', result: 'verified', durationMs: dur3 }],
            } : p));
            setWorkers(ws => ws.map(w => w.id === 'w-elig' ? { ...w, currentTask: `Cross-referencing EMR for ${pid}` } : w));
          }, randInt(6000, 7000));

          // STEP 4, T+~9s: Confirm and write back.
          setTimeout(() => {
            if (!stillRunning('w-elig')) return;
            const dur4 = randInt(900, 1500);
            const ts3 = nowHMS();
            pushFeed({ ts: ts3, worker: 'Eligibility Verification', patientId: pid, action: 'Eligibility confirmed. Updated patient record.', result: 'verified', durationMs: dur4 });
            setPatients(ps => ps.map(p => p.id === pid ? {
              ...p,
              history: [...p.history, { id: histId(), ts: ts3, worker: 'Eligibility Verification', action: 'Eligibility confirmed. Updated patient record.', result: 'verified', durationMs: dur4 }],
            } : p));
            setWorkers(ws => ws.map(w => w.id === 'w-elig' ? { ...w, tasksToday: w.tasksToday + 1, tasksWeek: w.tasksWeek + 1, tasksMonth: w.tasksMonth + 1, currentTask: `Verified ${pid}` } : w));
          }, randInt(8500, 9500));

          processedAny = true;
        }

        if (changeOn) {
          // Fires after the eligibility chain has visibly progressed (~10-12s in).
          setTimeout(() => {
            if (!stillRunning('w-change')) return;
            const flagged = Math.random() < 0.04;
            const ts2 = nowHMS();
            if (flagged) {
              const rsn = pickWeighted(EXCEPTION_REASONS);
              const fdur = randInt(1500, 2300);
              pushFeed({ ts: ts2, worker: 'Insurance Change Detection', patientId: pid, action: `Detected ${rsn.shortAction}. Flagging for review.`, result: 'flagged', durationMs: fdur });
              const exc = { id: `ex-${Date.now()}-${Math.random().toString(36).slice(2,6)}`, patientId: pid, reason: rsn.reason, urgency: rsn.urgency, flaggedAt: nowHM() };
              setExceptions(ex => [exc, ...ex].slice(0, 50));
              triageQueueRef.current.push(exc);
              setPatients(ps => ps.map(p => p.id === pid ? {
                ...p,
                status: 'exception',
                exceptionReason: rsn.reason,
                urgency: rsn.urgency,
                flaggedAt: nowHM(),
                coverageHistory: [{ date: 'Today', label: rsn.reason, urgency: rsn.urgency, payer: p.plan ? p.plan.split(' ')[0] : 'Payer' }, ...p.coverageHistory],
                history: [...p.history, { id: histId(), ts: ts2, worker: 'Insurance Change Detection', action: `Detected ${rsn.shortAction}. Flagging for review.`, result: 'flagged', durationMs: fdur }],
              } : p));
            } else {
              const noChangeDur = randInt(1100, 1700);
              pushFeed({ ts: ts2, worker: 'Insurance Change Detection', patientId: pid, action: 'Cross-referenced payer information. No changes detected.', result: 'no change', durationMs: noChangeDur });
              setPatients(ps => ps.map(p => p.id === pid ? {
                ...p,
                history: [...p.history, { id: histId(), ts: ts2, worker: 'Insurance Change Detection', action: 'Cross-referenced payer information. No changes detected.', result: 'no change', durationMs: noChangeDur }],
              } : p));
            }
            setWorkers(ws => ws.map(w => w.id === 'w-change' ? { ...w, tasksToday: w.tasksToday + 1, tasksWeek: w.tasksWeek + 1, tasksMonth: w.tasksMonth + 1, exceptionsFlagged: flagged ? w.exceptionsFlagged + 1 : w.exceptionsFlagged, currentTask: flagged ? `Flagged ${pid}` : `Checked ${pid}` } : w));
          }, randInt(10500, 12000));
        }

        if (triageOn && triageQueueRef.current.length > 0 && Math.random() < 0.55) {
          // Triage runs on its own slower cadence (~14-16s into the cycle).
          setTimeout(() => {
            if (!stillRunning('w-triage')) return;
            const exc = triageQueueRef.current.shift();
            if (!exc) return;
            const dur = randInt(2400, 3600);
            const ts3 = nowHMS();
            pushFeed({ ts: ts3, worker: 'Exception Triage', patientId: exc.patientId, action: 'Routed to billing team. Recommended action attached.', result: 'routed', durationMs: dur });
            setExceptions(ex => ex.filter(e => e.id !== exc.id));
            setPatients(ps => ps.map(p => p.id === exc.patientId ? {
              ...p,
              history: [...p.history, { id: histId(), ts: ts3, worker: 'Exception Triage', action: 'Routed to billing team. Recommended action attached.', result: 'routed', durationMs: dur }],
            } : p));
            setWorkers(ws => ws.map(w => w.id === 'w-triage' ? { ...w, tasksToday: w.tasksToday + 1, tasksWeek: w.tasksWeek + 1, tasksMonth: w.tasksMonth + 1, currentTask: `Routed ${exc.patientId}` } : w));
          }, randInt(13500, 15500));
        }

        if (processedAny) {
          recordLiveTick();
          incCurrentHourThroughput();
          setStats(s => ({
            ...s,
            processedToday: s.processedToday + 1,
            processedMonth: s.processedMonth + 1,
            hoursSavedMonth: s.hoursSavedMonth + 0.034,
            lastActivityHM: nowHM(),
          }));
        }
      }, [pushFeed, incCurrentHourThroughput, recordLiveTick]);

      // Main tick loop: schedules itself with natural jitter as long as any worker is running.
      // Uses a Web Worker (when available) to drive timing so background-tab throttling does not slow the demo.
      useEffect(() => {
        if (!anyRunning) return;
        let cancelled = false;
        let mainThreadTimer = null;
        let worker = null;

        const fire = () => {
          if (cancelled) return;
          tickOnce();
        };

        // Try to use a dedicated Web Worker for timer pacing (immune to background-tab throttling).
        try {
          const workerSrc = `let id=null;onmessage=function(e){if(e.data&&e.data.type==='start'){const tick=()=>{postMessage('tick');id=setTimeout(tick,4500+Math.random()*2000)};id=setTimeout(tick,400)}else if(e.data&&e.data.type==='stop'){if(id)clearTimeout(id);id=null}};`;
          const blob = new Blob([workerSrc], { type: 'application/javascript' });
          const url = URL.createObjectURL(blob);
          worker = new Worker(url);
          worker.onmessage = fire;
          worker.postMessage({ type: 'start' });
        } catch (err) {
          worker = null;
        }

        // Fallback: main-thread setTimeout loop (subject to throttling but works without Web Workers).
        if (!worker) {
          const loop = () => {
            if (cancelled) return;
            tickOnce();
            mainThreadTimer = setTimeout(loop, randInt(4500, 6500));
          };
          mainThreadTimer = setTimeout(loop, 400);
        }

        return () => {
          cancelled = true;
          if (mainThreadTimer) clearTimeout(mainThreadTimer);
          if (worker) {
            try { worker.postMessage({ type: 'stop' }); worker.terminate(); } catch (e) {}
          }
        };
      }, [anyRunning, tickOnce]);

      // Update "live last minute" stat once a second.
      useEffect(() => {
        const t = setInterval(() => {
          const now = Date.now();
          const cnt = lastMinuteBucketRef.current.filter(x => now - x < 60000).length;
          setStats(s => s.liveLastMinute === cnt ? s : { ...s, liveLastMinute: cnt });
        }, 1000);
        return () => clearInterval(t);
      }, []);

      // Integration pings: refresh "last sync" every 8s.
      useEffect(() => {
        const t = setInterval(() => {
          setIntegrations(prev => prev.map(p => {
            const seconds = randInt(20, 240);
            const label = seconds < 60 ? `${seconds} sec ago` : `${Math.round(seconds / 60)} min ago`;
            return { ...p, lastSync: label };
          }));
        }, 8000);
        return () => clearInterval(t);
      }, []);

      // Workflow step cycler: each running worker advances through its workflow steps.
      useEffect(() => {
        if (!anyRunning) return;
        const t = setInterval(() => {
          setWorkers(ws => ws.map(w => {
            if (w.status !== 'running') return w;
            const wf = WORKFLOWS[w.id];
            if (!wf) return w;
            const cur = (w.currentStep == null) ? 0 : (w.currentStep + 1) % wf.length;
            return { ...w, currentStep: cur };
          }));
        }, 380);
        return () => clearInterval(t);
      }, [anyRunning]);

      const startAll = useCallback(() => {
        setWorkers(ws => ws.map(w => ({ ...w, status: 'running', currentStep: 0, currentTask: initialTaskFor(w.id) })));
      }, []);
      const stopAll = useCallback(() => {
        setWorkers(ws => ws.map(w => ({ ...w, status: 'idle', currentStep: null, currentTask: 'Idle. Awaiting workforce start.' })));
      }, []);
      const toggleAll = useCallback(() => {
        const allIdle = workersRef.current.every(w => w.status === 'idle');
        if (allIdle) startAll(); else stopAll();
      }, [startAll, stopAll]);
      const toggleWorker = useCallback((id) => {
        setWorkers(ws => ws.map(w => w.id === id
          ? { ...w, status: w.status === 'idle' ? 'running' : 'idle', currentStep: w.status === 'idle' ? 0 : null, currentTask: w.status === 'idle' ? initialTaskFor(id) : 'Idle. Awaiting workforce start.' }
          : w));
      }, []);
      const pauseWorker = useCallback((id) => {
        setWorkers(ws => ws.map(w => {
          if (w.id !== id) return w;
          if (w.status === 'paused') return { ...w, status: 'running', currentStep: 0, currentTask: initialTaskFor(id) };
          if (w.status === 'running') return { ...w, status: 'paused', currentTask: 'Paused. Holding state.' };
          return w;
        }));
      }, []);

      // Resolve an exception manually (legacy helper).
      const resolveException = useCallback((id) => {
        setExceptions(ex => ex.filter(e => e.id !== id));
        triageQueueRef.current = triageQueueRef.current.filter(e => e.id !== id);
      }, []);

      /* Patient-level actions wired from the Patient Detail Modal. */
      const REVIEWER_NAMES = ['Lola Edwards', 'Marcus Hill', 'Priya Shah', 'Daniel Reyes'];

      const _appendPatientHistory = (pid, entry) => {
        setPatients(ps => ps.map(p => p.id === pid ? { ...p, history: [...p.history, { id: histId(), ...entry }] } : p));
      };

      const approvePatientException = useCallback((pid) => {
        const ts = nowHMS();
        setPatients(ps => ps.map(p => p.id === pid ? {
          ...p,
          status: 'verified',
          exceptionReason: null,
          urgency: null,
          flaggedAt: null,
          history: [...p.history, { id: histId(), ts, worker: 'Lola Edwards (reviewer)', action: 'Reviewer approved exception. Marking patient verified.', result: 'verified', durationMs: 0 }],
        } : p));
        setExceptions(ex => ex.filter(e => e.patientId !== pid));
        triageQueueRef.current = triageQueueRef.current.filter(e => e.patientId !== pid);
      }, []);

      const rejectPatientException = useCallback((pid) => {
        const ts = nowHMS();
        setPatients(ps => ps.map(p => p.id === pid ? {
          ...p,
          status: 'verified',
          exceptionReason: null,
          urgency: null,
          flaggedAt: null,
          history: [...p.history, { id: histId(), ts, worker: 'Lola Edwards (reviewer)', action: 'Reviewer rejected exception. Coverage reconfirmed and patient marked verified.', result: 'verified', durationMs: 0 }],
        } : p));
        setExceptions(ex => ex.filter(e => e.patientId !== pid));
        triageQueueRef.current = triageQueueRef.current.filter(e => e.patientId !== pid);
      }, []);

      const reassignPatientException = useCallback((pid) => {
        const ts = nowHMS();
        const reviewer = pickRandom(REVIEWER_NAMES.filter(n => n !== 'Lola Edwards'));
        setPatients(ps => ps.map(p => p.id === pid ? {
          ...p,
          history: [...p.history, { id: histId(), ts, worker: 'Lola Edwards (reviewer)', action: `Reassigned exception review to ${reviewer}.`, result: 'flagged', durationMs: 0 }],
        } : p));
      }, []);

      const addPatientNote = useCallback((pid, note) => {
        if (!note || !note.trim()) return;
        const ts = nowHMS();
        setPatients(ps => ps.map(p => p.id === pid ? {
          ...p,
          notes: [...p.notes, { id: histId(), ts, text: note.trim(), author: 'Lola Edwards' }],
          history: [...p.history, { id: histId(), ts, worker: 'Lola Edwards (reviewer)', action: `Note added: "${note.trim()}"`, result: 'note', durationMs: 0 }],
        } : p));
      }, []);

      return {
        workers, feed, exceptions, stats, throughput, integrations, patients,
        anyRunning,
        toggleAll, startAll, stopAll, toggleWorker, pauseWorker, resolveException,
        approvePatientException, rejectPatientException, reassignPatientException, addPatientNote,
      };
    }

    /* =====================================================
     *  PRIMITIVES
     * ===================================================== */
    const StatusBadge = ({ tone = 'neutral', dot = true, children, pulse = false }) => {
      const map = {
        success: { bg: '#DCFCE7', fg: '#166534', dot: '#16A34A' },
        warning: { bg: '#FEF3C7', fg: '#92400E', dot: '#D97706' },
        error:   { bg: '#FEE2E2', fg: '#991B1B', dot: '#DC2626' },
        info:    { bg: '#DCE7F3', fg: '#0F4C81', dot: '#0F4C81' },
        neutral: { bg: '#F3F4F6', fg: '#4B5563', dot: '#6B7280' },
      };
      const c = map[tone] || map.neutral;
      return (
        <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium" style={{ background: c.bg, color: c.fg }}>
          {dot && <span className={`w-1.5 h-1.5 rounded-full ${pulse ? 'pulse-dot' : ''}`} style={{ background: c.dot }} />}
          {children}
        </span>
      );
    };

    const Card = ({ title, subtitle, action, children, className = '', bodyClassName = 'p-5' }) => (
      <div className={`card card-elev ${className}`}>
        {(title || action) && (
          <div className="flex items-start justify-between px-5 pt-4 pb-3 border-b border-[#F0F1F3]">
            <div>
              {title && <h3 className="text-[13px] font-semibold text-gray-900 tracking-tight">{title}</h3>}
              {subtitle && <p className="text-[11px] text-gray-500 mt-0.5">{subtitle}</p>}
            </div>
            {action}
          </div>
        )}
        <div className={bodyClassName}>{children}</div>
      </div>
    );

    const ResultPill = ({ result }) => {
      const r = (result || '').toLowerCase();
      if (r === 'verified' || r === 'no change') return <StatusBadge tone="success" dot={false}>{result}</StatusBadge>;
      if (r === 'flagged') return <StatusBadge tone="warning" dot={false}>flagged</StatusBadge>;
      if (r === 'routed') return <StatusBadge tone="info" dot={false}>routed</StatusBadge>;
      if (r === 'pending') return <StatusBadge tone="info" dot={false}>pending</StatusBadge>;
      if (r === 'note') return <StatusBadge tone="neutral" dot={false}>note</StatusBadge>;
      return <StatusBadge tone="neutral" dot={false}>{result}</StatusBadge>;

    const AnimatedNumber = ({ value, format = fmtInt, duration = 500 }) => {
      const [shown, setShown] = useState(value);
      const fromRef = useRef(value);
      const toRef = useRef(value);
      const startRef = useRef(0);

      useEffect(() => {
        fromRef.current = shown;
        toRef.current = value;
        startRef.current = performance.now();
        let raf;
        const step = (now) => {
          const t = Math.min(1, (now - startRef.current) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          const v = fromRef.current + (toRef.current - fromRef.current) * eased;
          setShown(v);
          if (t < 1) raf = requestAnimationFrame(step);
        };
        raf = requestAnimationFrame(step);
        return () => cancelAnimationFrame(raf);
      }, [value]);

      // post-deploy autonomous (~75/day weekday, ramps up).
      const patients30d = [];
      for (let i = 29; i >= 0; i--) {
        const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
        const dow = d.getDay();
        const isWeekend = dow === 0 || dow === 6;
        const daysAgo = i;
        // Deployment day: 14 days ago. Ramp from day 16 to day 12.
        const isPostDeploy = daysAgo <= 14;
        const inRamp = daysAgo > 11 && daysAgo <= 14;
        let base;
        if (!isPostDeploy) base = 24;
        else if (inRamp) base = 24 + (15 - daysAgo) * 13;
        else base = 78;
        const v = isWeekend ? base * 0.32 : base + Math.sin(daysAgo * 0.7) * 6;
        const m = isPostDeploy && !isWeekend ? Math.round(v * 0.32) : (isWeekend ? Math.round(base * 0.18) : Math.round(v));
        const a = isPostDeploy ? Math.round(v) - m : 0;
        patients30d.push({ date: fmtDay(d), autonomous: Math.max(0, a), manual: Math.max(0, m) });
      }

      // Worker utilization, last 7 days. Weekend dips, weekday highs.
      const utilization = [];
      const dowLabels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
        const dow = d.getDay();
        const isWeekend = dow === 0 || dow === 6;
        const factor = isWeekend ? 0.25 : 1.0;
        utilization.push({
          day: dowLabels[dow],
          eligibility: +(2.4 * factor + Math.sin(i) * 0.15).toFixed(2),
          change: +(1.7 * factor + Math.sin(i + 1) * 0.12).toFixed(2),
          triage: +(0.55 * factor + Math.sin(i + 2) * 0.08).toFixed(2),
        });
      }

      // Processing time distribution (bucket counts across the last full month).
      const procTimeDist = [
        { range: 'under 0.5s', count: 24 },
        { range: '0.5 to 1.0s', count: 187 },
        { range: '1.0 to 1.5s', count: 642 },
        { range: '1.5 to 2.0s', count: 524 },
        { range: '2.0 to 2.5s', count: 312 },
        { range: '2.5 to 3.0s', count: 98 },
        { range: '3.0s+',     count: 41 },
      ];

      // Backlog reduction trend, last 30 days. Pre-deploy backlog grows, post-deploy collapses.
      const backlog = [];
      for (let i = 29; i >= 0; i--) {
        let val;
        if (i > 14) val = 1240 + (29 - i) * 12;
        else if (i > 11) val = 1440 - (15 - i) * 360;
        else val = Math.max(0, 30 - (12 - i) * 4);
        val = Math.max(0, Math.round(val + Math.sin(i * 1.3) * 12));
        backlog.push({ d: 30 - i, backlog: val });
      }

      // Exception types (counts across the last full month).
      const exceptionTypes = [
        { type: 'MA plan change', count: 26 },
        { type: 'Coverage termination', count: 14 },
        { type: 'Dual eligibility shift', count: 18 },
        { type: 'Address change', count: 11 },
        { type: 'Plan termination', count: 8 },
        { type: 'Secondary payer change', count: 7 },
      ];

      return { patients30d, utilization, procTimeDist, backlog, exceptionTypes };
    })();

    };

    /* =====================================================
     *  PATIENT OPERATIONS

    const StatusPill = ({ status }) => {
      if (status === 'verified') return <StatusBadge tone="success">Verified</StatusBadge>;
      if (status === 'pending') return <StatusBadge tone="info">Pending</StatusBadge>;
      if (status === 'exception') return <StatusBadge tone="warning">Exception</StatusBadge>;
      return <StatusBadge tone="neutral">{status}</StatusBadge>;
    };

    const CoveragePill = ({ coverage }) => {
      const tone = coverage === 'Medicare' ? 'info' : coverage === 'MA Plan' ? 'success' : 'neutral';
      return <StatusBadge tone={tone} dot={false}>{coverage}</StatusBadge>;
    };

    const FilterChip = ({ label, count, active, tone, onClick }) => {
      const toneFg = { info: '#0F4C81', success: '#166534', warning: '#92400E', neutral: '#374151' }[tone || 'neutral'];
      const toneBg = { info: '#F0F5FB', success: '#DCFCE7', warning: '#FEF3C7', neutral: '#F3F4F6' }[tone || 'neutral'];
      return (
        <button
          onClick={onClick}
          className={`h-8 px-3 text-[12px] font-medium rounded-md inline-flex items-center gap-1.5 transition-colors ${active ? 'border border-[#0F4C81] bg-[#F0F5FB] text-[#0F4C81]' : 'border border-[#E5E7EB] bg-white text-gray-700 hover:bg-gray-50'}`}
        >
          {label}
          {count !== undefined && (
            <span className="px-1.5 py-0.5 rounded-full text-[10.5px] font-semibold" style={{ background: active ? '#DCE7F3' : toneBg, color: active ? '#0F4C81' : toneFg }}>{count}</span>
          )}
        </button>
      );
    };

    const PATIENTS_PER_PAGE = 50;

    const PatientsPage = ({ sim, onOpenPatient }) => {
      const [statusFilter, setStatusFilter] = useState('all');
      const [coverageFilter, setCoverageFilter] = useState('all');
      const [timeFilter, setTimeFilter] = useState('today'); // today | 24h | 7d | all
      const [search, setSearch] = useState('');
      const [page, setPage] = useState(0);

      // Reset page when filters change.
      useEffect(() => { setPage(0); }, [statusFilter, coverageFilter, timeFilter, search]);

      const filtered = useMemo(() => {
        const now = Date.now();
        const since = timeFilter === 'today' ? new Date().setHours(0,0,0,0)
          : timeFilter === '24h' ? now - 86400000
          : timeFilter === '7d' ? now - 7 * 86400000
          : 0;
        const q = search.trim().toLowerCase();
        return sim.patients.filter(p => {
          if (statusFilter !== 'all' && p.status !== statusFilter) return false;
          if (coverageFilter !== 'all' && p.coverage !== coverageFilter) return false;
          if (since && p.verifiedAt < since) return false;
          if (q && !p.id.toLowerCase().includes(q)) return false;
          return true;
        });
      }, [sim.patients, statusFilter, coverageFilter, timeFilter, search]);

      const counts = useMemo(() => {
        const c = { all: sim.patients.length, verified: 0, pending: 0, exception: 0 };
        for (const p of sim.patients) c[p.status] = (c[p.status] || 0) + 1;
        return c;
      }, [sim.patients]);

      const pageRows = filtered.slice(page * PATIENTS_PER_PAGE, (page + 1) * PATIENTS_PER_PAGE);
      const totalPages = Math.max(1, Math.ceil(filtered.length / PATIENTS_PER_PAGE));

      return (
        <div className="px-6 py-5 max-w-[1600px] mx-auto space-y-5">
          <div className="flex items-end justify-between flex-wrap gap-3">
            <div>
              <div className="text-[11px] uppercase tracking-[0.12em] text-gray-500 font-medium">Patient Operations</div>
              <h1 className="text-[22px] font-semibold text-gray-900 tracking-tight mt-1">Patient Verification Queue</h1>
              <p className="text-[12.5px] text-gray-500 mt-1">Live table of patients flowing through the workforce. Click any row to drill into the verification history.</p>
            </div>
            <div className="flex items-center gap-3 text-[11.5px] text-gray-600">
              <StatusBadge tone={sim.anyRunning ? 'success' : 'neutral'} pulse={sim.anyRunning}>{sim.anyRunning ? 'live' : 'idle'}</StatusBadge>
              <span>{filtered.length.toLocaleString()} of {sim.patients.length.toLocaleString()} patients</span>
            </div>
          </div>

          {/* Filter bar */}
          <div className="card card-elev p-4">
            <div className="flex items-center gap-2 flex-wrap mb-3">
              <span className="text-[11px] text-gray-500 uppercase tracking-wide font-medium mr-1">Status</span>
              <FilterChip label="All" count={counts.all} active={statusFilter === 'all'} onClick={() => setStatusFilter('all')} />
              <FilterChip label="Verified" count={counts.verified} tone="success" active={statusFilter === 'verified'} onClick={() => setStatusFilter('verified')} />
              <FilterChip label="Pending" count={counts.pending || 0} tone="info" active={statusFilter === 'pending'} onClick={() => setStatusFilter('pending')} />
              <FilterChip label="Exception" count={counts.exception || 0} tone="warning" active={statusFilter === 'exception'} onClick={() => setStatusFilter('exception')} />
            </div>

            <div className="flex items-center gap-3 flex-wrap">
              <div className="flex items-center gap-2">
                <span className="text-[11px] text-gray-500 uppercase tracking-wide font-medium">Coverage</span>
                <select value={coverageFilter} onChange={e => setCoverageFilter(e.target.value)} className="h-8 px-2 text-[12px] bg-white border border-[#E5E7EB] rounded-md focus-ring">
                  <option value="all">All coverage types</option>
                  <option value="Medicare">Medicare (Traditional)</option>
                  <option value="MA Plan">MA Plan</option>
                  <option value="Dual Eligible">Dual Eligible</option>
                </select>
              </div>

              <div className="flex items-center gap-2">
                <span className="text-[11px] text-gray-500 uppercase tracking-wide font-medium">Last verified</span>
                <select value={timeFilter} onChange={e => setTimeFilter(e.target.value)} className="h-8 px-2 text-[12px] bg-white border border-[#E5E7EB] rounded-md focus-ring">
                  <option value="today">Today</option>
                  <option value="24h">Last 24 hours</option>
                  <option value="7d">Last 7 days</option>
                  <option value="all">All time</option>
                </select>
              </div>

              <div className="ml-auto relative">
                <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400">
                  <Icon name="search" size={13} />
                </span>
                <input
                  value={search}
                  onChange={e => setSearch(e.target.value)}
                  placeholder="Search by Patient ID..."
                  className="h-8 w-[220px] pl-8 pr-2 text-[12px] bg-white border border-[#E5E7EB] rounded-md focus-ring"
                />
              </div>
            </div>
          </div>

          {/* Patient table */}
          <div className="card card-elev overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-[12px]">
                <thead className="bg-[#FAFAFA] border-b border-[#EAEAEC]">
                  <tr className="text-left text-[10.5px] font-semibold text-gray-500 uppercase tracking-wide">
                    <th className="px-5 py-2.5 w-[120px]">Patient ID</th>
                    <th className="px-3 py-2.5 w-[140px]">Last Verified</th>
                    <th className="px-3 py-2.5 w-[120px]">Coverage</th>
                    <th className="px-3 py-2.5">Insurance Plan</th>
                    <th className="px-3 py-2.5 w-[200px]">Verification Worker</th>
                    <th className="px-3 py-2.5 w-[110px]">Status</th>
                    <th className="px-5 py-2.5 w-[44px]"></th>
                  </tr>
                </thead>
                <tbody>
                  {pageRows.length === 0 && (
                    <tr><td colSpan={7} className="px-5 py-12 text-center text-gray-500 text-[12.5px]">No patients match the current filters.</td></tr>
                  )}
                  {pageRows.map(p => (
                    <tr
                      key={p.id}
                      onClick={() => onOpenPatient(p.id)}
                      className={`border-t border-[#F0F1F3] hover:bg-[#F8FAFC] cursor-pointer ${p.newlyAdded ? 'flash-row' : ''}`}
                    >
                      <td className="px-5 py-2.5 font-mono text-[12px] text-[#0F4C81] font-medium">{p.id}</td>
                      <td className="px-3 py-2.5 text-gray-600">{fmtRelative(p.verifiedAt)}</td>
                      <td className="px-3 py-2.5"><CoveragePill coverage={p.coverage} /></td>
                      <td className="px-3 py-2.5 text-gray-700 truncate max-w-[280px]" title={p.plan}>{p.plan}</td>
                      <td className="px-3 py-2.5 text-gray-600">{p.verifiedBy}</td>
                      <td className="px-3 py-2.5"><StatusPill status={p.status} /></td>
                      <td className="px-5 py-2.5 text-right text-gray-400"><Icon name="chevron-right" size={14} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {/* Pagination */}
            <div className="px-5 py-3 border-t border-[#F0F1F3] flex items-center justify-between text-[11.5px] text-gray-600">
              <span>Showing {filtered.length === 0 ? 0 : page * PATIENTS_PER_PAGE + 1} to {Math.min(filtered.length, (page + 1) * PATIENTS_PER_PAGE)} of {filtered.length}</span>
              <div className="flex items-center gap-1">
                <button disabled={page === 0} onClick={() => setPage(p => Math.max(0, p - 1))} className="h-7 px-2.5 rounded border border-[#E5E7EB] bg-white hover:bg-gray-50 disabled:opacity-50 inline-flex items-center gap-1">
                  <Icon name="chevron-left" size={12} /> Previous
                </button>
                <span className="px-2 text-gray-500">Page {page + 1} of {totalPages}</span>
                <button disabled={page >= totalPages - 1} onClick={() => setPage(p => Math.min(totalPages - 1, p + 1))} className="h-7 px-2.5 rounded border border-[#E5E7EB] bg-white hover:bg-gray-50 disabled:opacity-50 inline-flex items-center gap-1">
                  Next <Icon name="chevron-right" size={12} />
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    /* =====================================================
     *  PATIENT DETAIL MODAL
     * ===================================================== */
    const TimelineEntry = ({ entry, last }) => {
      const r = (entry.result || '').toLowerCase();
      const tone = r === 'flagged' ? 'warning' : r === 'routed' ? 'info' : r === 'pending' ? 'info' : r === 'note' ? 'neutral' : 'success';
      const dotColor = tone === 'warning' ? '#D97706' : tone === 'info' ? '#0F4C81' : tone === 'neutral' ? '#6B7280' : '#16A34A';
      return (
        <div className="flex items-start gap-3 pb-4 relative last:pb-0">
          {!last && <span className="absolute left-[7px] top-4 bottom-0 w-px bg-[#E5E7EB]" />}
          <div className="w-[15px] h-[15px] rounded-full mt-1 shrink-0" style={{ background: dotColor }} />
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="font-mono text-[11px] text-gray-500">{entry.ts}</span>
              <span className="text-[12px] font-medium text-gray-900">{entry.worker}</span>
              <ResultPill result={entry.result === 'note' ? 'note' : entry.result} />
              {entry.durationMs > 0 && <span className="text-[10.5px] text-gray-400 font-mono">{entry.durationMs}ms</span>}
            </div>
            <div className="text-[12px] text-gray-700 mt-0.5">{entry.action}</div>
          </div>
        </div>
      );
    };

    const PatientDetailModal = ({ patient, onClose, onApprove, onReject, onReassign, onAddNote }) => {
      const [noteDraft, setNoteDraft] = useState('');

      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [onClose]);

      if (!patient) return null;
      const isException = patient.status === 'exception';
      const verifiedTs = fmtClock(patient.verifiedAt);
      const verifiedFull = new Date(patient.verifiedAt).toLocaleString();

      const submitNote = () => {
        if (!noteDraft.trim()) return;
        onAddNote(patient.id, noteDraft);
        setNoteDraft('');
      };

      return (
        <div className="fixed inset-0 z-50 flex items-start justify-center p-6 bg-black/40 fade-in-row" onClick={onClose}>
          <div className="bg-white rounded-lg shadow-xl w-full max-w-[1100px] max-h-[90vh] flex flex-col overflow-hidden mt-4" onClick={e => e.stopPropagation()}>
            {/* Header */}
            <div className="px-6 py-4 border-b border-[#EAEAEC] flex items-start gap-4">
              <div className="w-10 h-10 rounded-md bg-[#F0F5FB] text-[#0F4C81] flex items-center justify-center shrink-0">
                <Icon name="user" size={20} />
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 flex-wrap">
                  <h2 className="font-mono text-[18px] font-semibold text-[#0F4C81] tracking-tight">{patient.id}</h2>
                  <StatusPill status={patient.status} />
                  <CoveragePill coverage={patient.coverage} />
                </div>
                <p className="text-[12px] text-gray-600 mt-1">{patient.plan}</p>
                <div className="flex items-center gap-4 mt-2 text-[11px] text-gray-500">
                  <span><span className="text-gray-400">Last verified:</span> <span className="text-gray-700 font-medium">{verifiedFull}</span></span>
                  <span><span className="text-gray-400">By:</span> <span className="text-gray-700">{patient.verifiedBy}</span></span>
                </div>
              </div>
              <button onClick={onClose} className="w-8 h-8 rounded hover:bg-gray-100 flex items-center justify-center text-gray-500 ml-1" title="Close">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>

            {/* Exception action bar */}
            {isException && (
              <div className="px-6 py-3 border-b border-[#FDE68A] bg-[#FFFBEB] flex items-center gap-3 flex-wrap">
                <Icon name="alert" size={16} className="text-[#D97706]" />
                <div className="flex-1 min-w-0">
                  <div className="text-[12.5px] font-semibold text-[#92400E]">Exception flagged. Reviewer action required.</div>
                  <div className="text-[11.5px] text-gray-700">{patient.exceptionReason} · <UrgencyPill level={patient.urgency} /> · flagged at {patient.flaggedAt}</div>
                </div>
                <div className="flex items-center gap-2 shrink-0">
                  <button onClick={() => onApprove(patient.id)} className="h-8 px-3 text-[12px] font-semibold rounded inline-flex items-center gap-1.5 bg-[#16A34A] text-white hover:bg-[#15803D]">
                    <Icon name="check" size={12} strokeWidth={2.5} /> Approve
                  </button>
                  <button onClick={() => onReject(patient.id)} className="h-8 px-3 text-[12px] font-semibold rounded inline-flex items-center gap-1.5 bg-white border border-[#D1D5DB] text-gray-700 hover:bg-gray-50">
                    Reject
                  </button>
                  <button onClick={() => onReassign(patient.id)} className="h-8 px-3 text-[12px] font-semibold rounded inline-flex items-center gap-1.5 bg-white border border-[#D1D5DB] text-gray-700 hover:bg-gray-50">
                    Reassign
                  </button>
                </div>
              </div>
            )}

            {/* Body */}
            <div className="flex-1 grid grid-cols-1 lg:grid-cols-[minmax(0,1.4fr)_minmax(0,1fr)] gap-0 overflow-hidden">
              {/* Verification history timeline */}
              <div className="border-r border-[#F0F1F3] flex flex-col min-h-0">
                <div className="px-5 py-3 border-b border-[#F0F1F3] flex items-center justify-between">
                  <div>
                    <div className="text-[12px] font-semibold text-gray-900">Verification History</div>
                    <div className="text-[11px] text-gray-500">Every check performed and every result, in order.</div>
                  </div>
                  <span className="text-[11px] text-gray-500">{patient.history.length} events</span>
                </div>
                <div className="flex-1 overflow-auto p-5">
                  {patient.history.length === 0 ? (
                    <div className="text-center py-8 text-[12px] text-gray-500">No verification events recorded yet.</div>
                  ) : (
                    <div>
                      {patient.history.map((h, i) => (
                        <TimelineEntry key={h.id} entry={h} last={i === patient.history.length - 1} />
                      ))}
                    </div>
                  )}
                </div>
              </div>

              {/* Coverage history + audit trail + notes */}
              <div className="flex flex-col min-h-0 overflow-auto">
                {/* Coverage history */}
                <div className="px-5 py-3 border-b border-[#F0F1F3]">
                  <div className="text-[12px] font-semibold text-gray-900">Coverage History</div>
                  <div className="text-[11px] text-gray-500">Detected changes to insurance state.</div>
                </div>
                <div className="px-5 py-3 border-b border-[#F0F1F3]">
                  {patient.coverageHistory.length === 0 ? (
                    <div className="text-[11.5px] text-gray-500">No coverage changes detected on this patient.</div>
                  ) : (
                    <ul className="space-y-2">
                      {patient.coverageHistory.map((c, i) => (
                        <li key={i} className="flex items-start gap-3">
                          <Icon name="alert" size={14} className="text-[#D97706] mt-0.5 shrink-0" />
                          <div className="flex-1 min-w-0">
                            <div className="text-[12px] font-medium text-gray-900">{c.label}</div>
                            <div className="text-[11px] text-gray-500 mt-0.5">{c.date} · payer: {c.payer} · <UrgencyPill level={c.urgency} /></div>
                          </div>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>

                {/* Audit summary */}
                <div className="px-5 py-3 border-b border-[#F0F1F3]">
                  <div className="text-[12px] font-semibold text-gray-900">Audit Trail</div>
                  <div className="text-[11px] text-gray-500 mt-0.5">All actions recorded for compliance review.</div>
                </div>
                <div className="px-5 py-3 border-b border-[#F0F1F3]">
                  <div className="grid grid-cols-2 gap-2">
                    <div className="bg-[#F9FAFB] rounded px-2.5 py-1.5">
                      <div className="text-[10px] text-gray-500 uppercase tracking-wide">Events recorded</div>
                      <div className="text-[14px] font-semibold text-gray-900">{patient.history.length}</div>
                    </div>
                    <div className="bg-[#F9FAFB] rounded px-2.5 py-1.5">
                      <div className="text-[10px] text-gray-500 uppercase tracking-wide">Notes</div>
                      <div className="text-[14px] font-semibold text-gray-900">{patient.notes.length}</div>
                    </div>
                  </div>
                  <div className="mt-2 flex items-center gap-2 text-[11px] text-[#166534]">
                    <Icon name="check-circle" size={12} />
                    <span>Audit trail complete and HIPAA compliant.</span>
                  </div>
                </div>

                {/* Notes */}
                <div className="px-5 py-3 border-b border-[#F0F1F3]">
                  <div className="text-[12px] font-semibold text-gray-900">Reviewer Notes</div>
                </div>
                <div className="px-5 py-3 flex-1">
                  {patient.notes.length > 0 && (
                    <ul className="space-y-2 mb-3">
                      {patient.notes.map(n => (
                        <li key={n.id} className="border border-[#EAEAEC] rounded-md p-2.5">
                          <div className="text-[12px] text-gray-800">{n.text}</div>
                          <div className="text-[10.5px] text-gray-500 mt-1">{n.author} · {n.ts}</div>
                        </li>
                      ))}
                    </ul>
                  )}
                  <div className="flex items-stretch gap-2">
                    <input
                      value={noteDraft}
                      onChange={e => setNoteDraft(e.target.value)}
                      onKeyDown={e => { if (e.key === 'Enter') submitNote(); }}
                      placeholder="Add a note..."
                      className="flex-1 h-8 px-2.5 text-[12px] bg-white border border-[#E5E7EB] rounded-md focus-ring"
                    />
                    <button onClick={submitNote} disabled={!noteDraft.trim()} className="h-8 px-3 text-[12px] font-medium rounded bg-brand-navy text-white hover-brand-navy disabled:opacity-50">
                      Add note
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    /* =====================================================
     *  ROOT APP
     * ===================================================== */
    const App = () => {
      const [collapsed, setCollapsed] = useState(false);
      const [page, setPage] = useState('dashboard');
      const [viewWorkerId, setViewWorkerId] = useState(null);
      const [viewPatientId, setViewPatientId] = useState(null);
      const sim = useSimulation();
      const openWorker = useCallback((id) => setViewWorkerId(id), []);
      const closeWorker = useCallback(() => setViewWorkerId(null), []);
      const openPatient = useCallback((id) => setViewPatientId(id), []);
      const closePatient = useCallback(() => setViewPatientId(null), []);
      const viewedWorker = sim.workers.find(w => w.id === viewWorkerId);
      const viewedPatient = sim.patients.find(p => p.id === viewPatientId);

      return (
        <div className="h-full flex flex-col">
          <Header onToggleSidebar={() => setCollapsed(c => !c)} anyRunning={sim.anyRunning} exceptionsCount={sim.exceptions.length} />
          <div className="flex-1 flex min-h-0">
            <Sidebar collapsed={collapsed} page={page} onNavigate={setPage} />
            <main className="flex-1 overflow-auto bg-[#FAFAFA]">
              {page === 'dashboard' && <Dashboard sim={sim} onOpenWorker={openWorker} onOpenPatient={openPatient} onNavigatePatients={() => setPage('patients')} />}
              {page === 'workforce' && <WorkforcePage sim={sim} onOpenWorker={openWorker} />}
              {page === 'patients' && <PatientsPage sim={sim} onOpenPatient={openPatient} />}
              {page === 'analytics' && <AnalyticsPage sim={sim} />}
            </main>
          </div>
          <Footer />
          {viewedWorker && (
            <WorkerDetailModal
              worker={viewedWorker}
              feed={sim.feed}
              onClose={closeWorker}
              onToggle={sim.toggleWorker}
              onPause={sim.pauseWorker}
            />
          )}
          {viewedPatient && (
            <PatientDetailModal
              patient={viewedPatient}
              onClose={closePatient}
              onApprove={sim.approvePatientException}
              onReject={sim.rejectPatientException}
              onReassign={sim.reassignPatientException}
              onAddNote={sim.addPatientNote}
            />
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
